name: Proposal skeleton

# Started by a maintainer for one interoperability check on the open track. A private-track
# proposal is never made here: it is made with scripts/proposals/new_proposal.py --track private
# in a directory outside any public repository.
#
# It creates the skeleton
# of a proposal on a new branch: the pinned public files with their SHA-256 and
# size, templates for the mapping, the inputs and the expectations, and a draft
# result row that records who initiated the check without naming anyone. It
# writes no mapping and runs no appraiser. On request it asks Software Heritage
# to archive the pinned repositories, so the bytes stay retrievable.
#
# The inputs come from the automatic first reply on the check (repository,
# commit and path of each pinned file). They are passed through the environment
# and validated by the script; nothing is interpolated into a command.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Directory name, for example atx-boundary-001'
        required: true
      title:
        description: 'One plain line: what is examined'
        required: true
      issue:
        description: 'Number of the check in WEXP-dev/interop-test-lab (optional)'
        required: false
      pins:
        description: 'Pinned files, space separated: owner/repo@<40-hex commit>:path (pins or drafts, or both)'
        required: false
      drafts:
        description: 'Internet-Drafts with their revision, space separated: draft-example-record-02'
        required: false
      relation:
        description: 'What the automatic reply says about the account that opened the check'
        type: choice
        default: not-established
        options: [not-established, repository-owner, organization-public-member, repository-contributor, specification-author]
      archive:
        description: 'Ask Software Heritage to archive the pinned repositories'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  skeleton:
    name: create the skeleton branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pull_request: ${{ steps.publish.outputs.pull_request }}
    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the skeleton
        env:
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
          ISSUE: ${{ inputs.issue }}
          PINS: ${{ inputs.pins }}
          DRAFTS: ${{ inputs.drafts }}
          RELATION: ${{ inputs.relation }}
        run: |
          set -euo pipefail
          args=(--slug "$SLUG" --title "$TITLE" --relation "$RELATION")
          case "$ISSUE" in
            '') ;;
            *[!0-9]*) echo "::error::issue must be a number"; exit 1 ;;
            *) args+=(--issue "$ISSUE") ;;
          esac
          set -f
          for pin in $PINS; do args+=(--pin "$pin"); done
          for draft in $DRAFTS; do args+=(--draft "$draft"); done
          set +f
          python -B scripts/proposals/new_proposal.py "${args[@]}"
          # The results pages are generated from the rows, so a new row changes them.
          python -B scripts/proposals/result_table.py
      - name: Ask Software Heritage to archive the pinned repositories
        if: inputs.archive
        continue-on-error: true
        env:
          SLUG: ${{ inputs.slug }}
        run: python -B scripts/proposals/request_archive.py "docs/proposals/$SLUG" --send
      - name: Commit, push the branch and open a draft pull request
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          ISSUE: ${{ inputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$SLUG" in *[!a-z0-9-]*|'') echo "::error::unexpected slug"; exit 1 ;; esac
          # Naming the check in the pull request makes GitHub show this pull request in the
          # timeline of the check, where the person who asked can see it.
          origin=""
          case "$ISSUE" in
            '') ;;
            *[!0-9]*) echo "::error::issue must be a number"; exit 1 ;;
            *) origin="For interoperability check WEXP-dev/interop-test-lab#$ISSUE. " ;;
          esac
          branch="proposal/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "docs/proposals/$SLUG" docs/proposals/RESULTS.md docs/proposals/OPEN-READINGS.md
          git commit --quiet -m "proposal $SLUG: skeleton with pinned public bytes"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          echo "### Proposal skeleton" >> "$GITHUB_STEP_SUMMARY"
          echo "- branch: pushed, \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
          # Each outcome is reported on its own: a green run does not by itself mean that the
          # pull request exists or that the check was told.
          if url="$(gh pr create --repo "$REPO" --base main --head "$branch" --draft \
              --title "proposal $SLUG: mapping and expectations (draft)" \
              --body "${origin}Skeleton created for one interoperability check. Next: the mapping and the expected results, then the freeze, then the run. Corrections are welcome in the pull request, in any form. See docs/proposals/README.md.")"; then
            case "$url" in https://github.com/*/pull/[0-9]*) ;; *) url="" ;; esac
          else
            url=""
          fi
          if [ -n "$url" ]; then
            echo "- draft pull request: created, $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the branch is pushed and no pull request was created; open it by hand as a draft and name the check in its body"
            echo "- draft pull request: NOT created; open it by hand" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pull_request=$url" >> "$GITHUB_OUTPUT"

  # Tells the person who asked that the work has started, in the check itself.
  # The token is used here only: this job checks out nothing, runs no script of
  # the repository, and sees none of the pinned bytes. Without the secret the
  # job does nothing, and the maintainer leaves the note by hand.
  tell-the-check:
    name: leave a note in the check
    needs: skeleton
    if: inputs.issue != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Comment in the check
        env:
          GH_TOKEN: ${{ secrets.CHECK_COMMENT_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          SLUG: ${{ inputs.slug }}
          REPO: ${{ github.repository }}
          PULL: ${{ needs.skeleton.outputs.pull_request }}
        run: |
          set -euo pipefail
          echo "### Note in the check" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no CHECK_COMMENT_TOKEN; leave the note in the check by hand"
            echo "- NOT left: no token; leave it by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$ISSUE" in *[!0-9]*|'') echo "::error::issue must be a number"; exit 1 ;; esac
          case "$SLUG" in *[!a-z0-9-]*|'') echo "::error::unexpected slug"; exit 1 ;; esac
          case "$PULL" in ''|https://github.com/*/pull/[0-9]*) ;; *) echo "::error::unexpected pull request address"; exit 1 ;; esac
          if [ -n "$PULL" ]; then
            where="Its draft pull request, $PULL, is where you can read and answer."
          else
            where="A maintainer will open the pull request where you can read and answer, and link it here."
          fi
          gh issue comment "$ISSUE" --repo WEXP-dev/interop-test-lab --body "A maintainer has started a proposal for this check. The mapping, the expected results and later the run are kept on the branch [\`proposal/$SLUG\`](https://github.com/$REPO/tree/proposal/$SLUG) of \`$REPO\`. $where Nothing there is a result yet."
          echo "- left in WEXP-dev/interop-test-lab#$ISSUE" >> "$GITHUB_STEP_SUMMARY"
