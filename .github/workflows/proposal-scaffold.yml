name: Proposal skeleton

# Started by a maintainer for one interoperability check. Creates the skeleton
# of a proposal on a new branch: the pinned public files with their SHA-256 and
# size, templates for the mapping, the inputs and the expectations, and a draft
# result row that records who initiated the check without naming anyone. It
# writes no mapping and runs no appraiser. On request it asks Software Heritage
# to archive the pinned repositories, so the bytes stay retrievable.
#
# The inputs come from the automatic first reply on the check (repository,
# commit and path of each pinned file). They are passed through the environment
# and validated by the script; nothing is interpolated into a command.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Directory name, for example atx-boundary-001'
        required: true
      title:
        description: 'One plain line: what is examined'
        required: true
      issue:
        description: 'Number of the check in WEXP-dev/interop-test-lab (optional)'
        required: false
      pins:
        description: 'Pinned files, space separated: owner/repo@<40-hex commit>:path'
        required: true
      relation:
        description: 'What the automatic reply says about the account that opened the check'
        type: choice
        default: not-established
        options: [not-established, repository-owner, organization-public-member, repository-contributor]
      archive:
        description: 'Ask Software Heritage to archive the pinned repositories'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  skeleton:
    name: create the skeleton branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the skeleton
        env:
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
          ISSUE: ${{ inputs.issue }}
          PINS: ${{ inputs.pins }}
          RELATION: ${{ inputs.relation }}
        run: |
          set -euo pipefail
          args=(--slug "$SLUG" --title "$TITLE" --relation "$RELATION")
          case "$ISSUE" in
            '') ;;
            *[!0-9]*) echo "::error::issue must be a number"; exit 1 ;;
            *) args+=(--issue "$ISSUE") ;;
          esac
          set -f
          for pin in $PINS; do args+=(--pin "$pin"); done
          set +f
          python -B scripts/proposals/new_proposal.py "${args[@]}"
      - name: Ask Software Heritage to archive the pinned repositories
        if: inputs.archive
        continue-on-error: true
        env:
          SLUG: ${{ inputs.slug }}
        run: python -B scripts/proposals/request_archive.py "docs/proposals/$SLUG" --send
      - name: Commit, push the branch and open a draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          ISSUE: ${{ inputs.issue }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$SLUG" in *[!a-z0-9-]*|'') echo "::error::unexpected slug"; exit 1 ;; esac
          # Naming the check in the pull request makes GitHub show this pull request in the
          # timeline of the check, where the person who asked can see it.
          origin=""
          case "$ISSUE" in
            '') ;;
            *[!0-9]*) echo "::error::issue must be a number"; exit 1 ;;
            *) origin="For interoperability check WEXP-dev/interop-test-lab#$ISSUE. " ;;
          esac
          branch="proposal/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "docs/proposals/$SLUG"
          git commit --quiet -m "proposal $SLUG: skeleton with pinned public bytes"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" --draft \
            --title "proposal $SLUG: mapping and expectations (draft)" \
            --body "${origin}Skeleton created for one interoperability check. Next: the mapping and the expected results, then the freeze, then the run. The README of the proposal has ready one-line answers for the author of the format. See docs/proposals/README.md." \
            || echo "::warning::the branch is pushed; open the pull request by hand as a draft and name the check in its body (this repository does not let Actions create pull requests)"
