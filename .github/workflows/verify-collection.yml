name: Verify collection and versioned experimental evidence

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact event commit with history
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned verification dependencies
        run: python -m pip install -r requirements-verification.txt
      - name: Validate cards, catalog, manifests, local links and saved AAR evidence
        run: |
          python -B scripts/catalog.py --check
          python -B scripts/verify_collection.py > "$RUNNER_TEMP/wexp-collection-and-aar-evidence.json"
          cat "$RUNNER_TEMP/wexp-collection-and-aar-evidence.json"
      - name: Exercise collection rejection controls
        run: python -B scripts/check_collection_controls.py --out "$RUNNER_TEMP/wexp-collection-controls.json"
      - name: Read-only Core-02 catalog regression checks
        run: |
          python -B -m unittest discover -s scripts -p 'test_wimse_core02_catalog.py'
          python -O -B -m unittest discover -s scripts -p 'test_wimse_core02_catalog.py'
      - name: Replay EMILIA archive and freeze checks
        run: python -B scripts/verify_emilia.py --out "$RUNNER_TEMP/wexp-emilia-replay"
      - name: Check a fresh Git clone of the exact event commit
        run: |
          python -B scripts/emilia/verify_clean_clone.py \
            --repository "$GITHUB_WORKSPACE" \
            --commit "$(git rev-parse HEAD)" \
            --archive experiments/emilia-interop-001/packages/pkg-001/source-archive/WEXP-EMILIA-INTEROP-001-PUBLICATION-CANDIDATE.zip \
            --destination "$RUNNER_TEMP/wexp-emilia-clean-clone" \
            --report "$RUNNER_TEMP/wexp-emilia-clean-clone.json"
      - name: Preserve exact-commit verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: collection-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wexp-collection-and-aar-evidence.json
            ${{ runner.temp }}/wexp-collection-controls.json
            ${{ runner.temp }}/wexp-emilia-replay/*.json
            ${{ runner.temp }}/wexp-emilia-clean-clone.json
          if-no-files-found: warn
