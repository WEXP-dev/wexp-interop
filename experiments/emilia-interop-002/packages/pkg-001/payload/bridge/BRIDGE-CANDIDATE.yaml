#
# This is NOT a generic Bridge Framework. It is one experiment's mapping from
# the frozen EMILIA outcome-binding evidence to a WEXP Core-01 AppraisalInput,
# authored after the effective Design Freeze and against frozen authorities
# only. Charter Sections 7 and 13 govern it. Nothing here may be promoted to
# interop_core, to a WEXP or EMILIA profile, or to a reusable mapping.

