non_inference_rules:
  - "A valid signature or digest check does not establish content truth, boundary control, or semantic support"
  - "EMILIA independent_observer or the word independent does not establish WEXP IV"
  - "in_bounds does not establish invocation or execution"
  - "An EMILIA lifecycle state does not determine a WEXP verdict"
  - "CAID/action correlation does not define WEXP target equality or arguments-hash identity"
  - "Invocation or dispatch does not establish execution or effect"
  - "An unavailable meter or absent record does not establish nonoccurrence"
  - "A source-role label alone does not establish a passing boundary or base finding"

